appId: com.raicesfrontend.app
---
# Test Case: TC-001-N-001
# Description: Verify successful Authentication via Dev Login

- launchApp:
    appId: com.raicesfrontend.app

# Wait for Expo to build the bundle and load the app (up to 30 seconds)
- extendedWaitUntil:
    visible: "Raíces"
    timeout: 45000
- assertVisible: "Correo electrónico"

# Input Dev Credentials
- tapOn: "Correo electrónico"
- inputText: "caregiver@example.com"
- tapOn: "Contraseña"
- inputText: "password123"

# Hide keyboard before clicking submit (often needed on smaller Android screens)
- hideKeyboard

# Submit the form
- tapOn: "Iniciar sesión"

# Wait for the network request and verify we reached the Caregiver Dashboard
- extendedWaitUntil:
    visible: "Dashboard - Cuidador"
    timeout: 10000
- assertVisible: "Hola, David"
