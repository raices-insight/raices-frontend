name: Build Android APK (EAS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL del API Gateway (ej: https://api.raices.app)'
        required: true
        default: 'https://raices-backend-production.up.railway.app'
      login_mode:
        description: 'Modo de login (GOOGLE_ONLY o LOCAL_DEVELOPMENT)'
        required: true
        default: 'GOOGLE_ONLY'
        type: choice
        options:
          - GOOGLE_ONLY
          - LOCAL_DEVELOPMENT
      profile:
        description: 'Perfil de EAS Build'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --passWithNoTests

  build-apk:
    name: Build Android APK via EAS
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only build on tags or manual dispatch — branch pushes only run lint+test
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute artifact name
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="manual-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=raices-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON_B64}" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_B64 secret"
            exit 1
          fi
          echo "${GOOGLE_SERVICES_JSON_B64}" | base64 -d > google-services.json
          echo "GOOGLE_SERVICES_JSON=$(pwd)/google-services.json" >> "$GITHUB_ENV"

      - name: Seed EAS env vars from GitHub Secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ github.event.inputs.profile || 'preview' }}
          API_URL: ${{ github.event.inputs.api_url || secrets.EXPO_PUBLIC_API_URL }}
          LOGIN_MODE: ${{ github.event.inputs.login_mode || 'GOOGLE_ONLY' }}
          WEB_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          IOS_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          ANDROID_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${API_URL:-}" ]     && missing+=("EXPO_PUBLIC_API_URL")
          [ -z "${WEB_ID:-}" ]      && missing+=("EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID")
          [ -z "${IOS_ID:-}" ]      && missing+=("EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID")
          [ -z "${ANDROID_ID:-}" ]  && missing+=("EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi

          ENVIRONMENT="$PROFILE"

          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          {
            echo "EXPO_PUBLIC_API_URL=$API_URL"
            echo "EXPO_PUBLIC_LOGIN_MODE=$LOGIN_MODE"
            echo "EXPO_PUBLIC_IS_PROD=true"
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$WEB_ID"
            echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$IOS_ID"
            echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=$ANDROID_ID"
          } > "$ENV_FILE"

          eas env:push "$ENVIRONMENT" \
            --path "$ENV_FILE" \
            --force

          echo "::group::Vars now registered in EAS for $ENVIRONMENT"
          eas env:list "$ENVIRONMENT" || true
          echo "::endgroup::"

      - name: Build APK via EAS Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"

          echo "::group::EAS environment variables for $PROFILE"
          eas env:list "$PROFILE" || true
          echo "::endgroup::"

          echo "::group::eas build invocation"
          set +e
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --json > build-result.json 2> build-error.log
          BUILD_EXIT=$?
          set -e
          echo "::endgroup::"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::eas build exited with $BUILD_EXIT"
            echo "----- stderr -----"
            cat build-error.log || true
            echo "----- stdout (build-result.json) -----"
            cat build-result.json || echo "(empty)"
            exit "$BUILD_EXIT"
          fi

          ARTIFACT_URL=$(jq -r '.[0].artifacts.buildUrl' build-result.json)
          if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" = "null" ]; then
            echo "::error::No artifact URL found in EAS build result"
            cat build-result.json
            exit 1
          fi
          echo "Downloading APK from $ARTIFACT_URL"
          curl -fL --retry 3 -o "${{ steps.meta.outputs.apk_name }}" "$ARTIFACT_URL"
          ls -lh "${{ steps.meta.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.apk_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
